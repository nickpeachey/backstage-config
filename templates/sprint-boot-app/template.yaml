apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: spring-boot4-webapi-template
  title: Spring Boot 4 Web API
  description: Create a Spring Boot 4 Web API, push it to GitHub, and register it in Backstage as a Component and API.
  tags:
    - java
    - spring-boot
    - webapi
    - recommended
spec:
  owner: user:guest
  type: service

  # These parameters are used to generate the input form in the frontend, and are
  # used to gather input data for the execution of the template.
  parameters:
    - title: Provide project information
      required:
        - name
        - owner
        - system
        - jiraProjectKey
        - jiraComponent
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Help others understand what this Web API is for
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
        system:
          title: System
          type: string
          description: System that this API belongs to
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind:
                - System
        jiraProjectKey:
          title: Jira Project Key
          type: string
          description: Jira project key whose issues (e.g. Trivy security tickets) should show on this component, such as SEC
        jiraComponent:
          title: Jira Component
          type: string
          description: Jira component name; only Trivy issues tagged with this component are shown (often the service name)
    - title: Java Package
      required:
        - javaPackage
      properties:
        javaPackage:
          title: Java Package
          type: string
          description: Base Java package for the application, e.g. com.example.myapp
          default: com.${{ parameters.name }}.app
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
          ui:help: Lowercase, dot-separated segments that are valid Java identifiers (no hyphens)
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # These steps are executed in the scaffolder backend, using data that we gathered
  # via the parameters above.
  steps:
    # Templates the Spring Boot 4 Web API skeleton into the working directory.
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          javaPackage: ${{ parameters.javaPackage }}
          packagePath: ${{ parameters.javaPackage | replace(r/\./g, "/") }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          jiraProjectKey: ${{ parameters.jiraProjectKey }}
          jiraComponent: ${{ parameters.jiraComponent }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    # This step publishes the contents of the working directory to GitHub.
    - id: publish
      name: Publish
      action: publish:github
      input:
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: "main"

    # The final step is to register our new component in the catalog.
    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    # Let's notify the user that the template has completed using the Notification action
    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - ${{ parameters.owner }}
        title: "Template executed"
        info: "Your Spring Boot 4 Web API ${{ parameters.name }} has been created"
        severity: "normal"

  # Outputs are displayed to the user after a successful execution of the template.
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
